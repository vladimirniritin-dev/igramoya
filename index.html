      <button class="guide-topic" type="button" data-guide="tips" aria-pressed="false">💡 Личные подсказки</button>
    </nav><article class="guide-article" id="guide-article" aria-live="polite"></article></div>
    <p class="guide-note">Подсказки описывают текущие механики этой версии игры. Если механика изменится, текст справки можно будет обновить.</p>

<script>
(()=>{
 const modal=document.getElementById('guide-modal'), helper=document.getElementById('learning-helper'), article=document.getElementById('guide-article');
 if(!modal||!helper||!article)return;
 const guides={
 start:{title:'🌸 В чём цель игры?',body:'<p>«Летние истории» — симулятор жизни и визуальная новелла. Ты создаёшь героя, исследуешь приморский город, знакомишься с его жителями, развиваешь характеристики и постепенно раскрываешь личные истории.</p><ul><li>Создай персонажа и начни новую историю.</li><li>Исследуй разные места и встречай жителей.</li><li>Выстраивай отношения, выполняй задания и следи за состоянием героя.</li><li>Решения в личных историях влияют на развитие отношений и доступные финалы.</li></ul><p>Здесь нет необходимости спешить: выбирай собственный темп и стиль прохождения.</p>'},
 relations:{title:'💗 Как строить отношения?',body:'<p>Отношения развиваются через знакомство, общение и совместные решения.</p><ul><li>Посещай городские локации: там можно встретить новых персонажей.</li><li>Открывай профиль знакомого, разговаривай и узнавай его интересы.</li><li>Используй доступные действия: подарки, свидания, совместные прогулки и приглашения домой.</li><li>Уважай границы персонажа. В романтических сценах важны взаимное согласие и комфорт.</li></ul><p>В профилях отношений отображаются симпатия, доверие и этап личной истории. Не каждое действие одинаково уместно для каждого персонажа.</p>'},
 skills:{title:'✨ Как развивать навыки?',body:'<p>Основные характеристики отображаются в верхней панели и в профиле героя.</p><ul><li><b>Красота и уход:</b> действие «Уход за собой» повышает уход и немного красоту.</li><li><b>Форма:</b> силовые тренировки, кардио, йога, бег и плавание развивают физическую форму.</li><li><b>Интеллект:</b> чтение и рисование повышают интеллект.</li><li><b>Харизма:</b> танцы, фотография и гитара развивают харизму.</li><li><b>Настроение:</b> прогулки, готовка, медитация и приятный досуг помогают его поддерживать.</li></ul><p>У занятий есть стоимость в энергии, а у некоторых — денежная цена. Смотри требования перед действием.</p>'},
 city:{title:'🗺️ Город и занятия',body:'<p>На вкладке «Город» выбери место на карте. Среди доступных локаций есть дом, университет, кафе, парк, пляж, спортзал, клуб и библиотека.</p><ul><li>В каждой локации доступны свои занятия.</li><li>Смотри, кто находится рядом: можно открыть карточку персонажа и выбрать действие.</li><li>Переход между местами расходует энергию.</li><li>Некоторые занятия открывают новые встречи и помогают выполнять задания.</li></ul>'},
 time:{title:'⚡ Энергия и игровое время',body:'<p>Действия расходуют энергию и продвигают игровое время. Если энергии не хватает, сначала отдохни.</p><ul><li>Лёгкий отдых восстанавливает энергию и улучшает настроение; дневной лимит отдыха ограничен.</li><li>У многих занятий есть дневной лимит — обычно до трёх повторений.</li><li>Планируй дела: тренировки и некоторые поездки требуют больше энергии.</li><li>Погода и время суток меняются по ходу игрового дня.</li></ul>'},
 money:{title:'💰 Деньги и работа',body:'<p>Некоторые занятия и развлечения требуют денег. Перед действием игра показывает цену, а при нехватке средств сообщает об этом.</p><ul><li>Следи за балансом в интерфейсе героя.</li><li>Планируй платные активности: спортзал, кафе, кино и отдельные занятия.</li><li>Работа и зарплата связаны с игровым календарём и выполнением смен.</li></ul><p>Если не хватает средств, выбери бесплатное занятие или удели время работе, когда она доступна.</p>'},
 quests:{title:'📋 Задания и события',body:'<p>Задания помогают знакомиться с механиками и задают ближайшие цели.</p><ul><li>Проверяй вкладку с заданиями и отмечай условия выполнения.</li><li>Следи за уведомлениями и письмами: там появляются сообщения и события.</li><li>Некоторые события требуют выбора. Прочитай варианты перед подтверждением.</li><li>Особые воспоминания и сцены могут появляться в альбоме после открытия.</li></ul>'},
 save:{title:'💾 Сохранения и настройки',body:'<p>В главном меню можно продолжить игру или выбрать сохранение. Настройки музыки и озвучки находятся в разделе настроек.</p><ul><li>Сохраняйся перед важными решениями и сюжетными событиями.</li><li>Не очищай данные сайта браузера, если используешь локальные сохранения на этом устройстве.</li><li>После загрузки проверь, что выбран нужный слот сохранения.</li></ul>'}
 };
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function data(){try{return window.gameGuideAPI?.snapshot?.()||null}catch(e){return null}}
 function dynamicGuide(key){const d=data();if(!d)return null;
  if(key==='journal'){
   const rel=d.known.length?d.known.map(p=>`<div class="guide-record"><b>${esc(p.name)}</b><div class="guide-meters"><span>💗 Симпатия: ${p.love}</span><span>🤝 Доверие: ${p.trust}</span><span>🌿 Уважение: ${p.respect}</span></div></div>`).join(''):'<p>Пока нет знакомых персонажей. Отправляйся в город и знакомься с его жителями — здесь появится сводка ваших отношений.</p>';
   const logs=d.log.length?d.log.map(x=>`<li>${esc(x)}</li>`).join(''):'<li>Записи появятся после первых действий в игре.</li>';
   return {title:'📖 Дневник отношений и событий',body:`<p>Текущая глава: <b>день ${d.day}</b>. Здесь собраны отношения и последние заметки игрового журнала.</p><h4>Знакомства</h4>${rel}<h4>Последние события</h4><ul>${logs}</ul><p class="guide-note">Дневник формируется из событий, которые игра уже записывает. Он не меняет отношения и не расходует игровые ресурсы.</p>`};
  }
  if(key==='calendar'){
   const weekday=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
   const dayNames=Array.from({length:7},(_,i)=>{let n=d.day+i;return `<div class="calendar-day ${i===0?'today':''}"><b>${weekday[(n-1)%7]}</b><strong>День ${n}</strong>${i===0?`<small>Сейчас ${String(d.hour).padStart(2,'0')}:00</small>`:'<small>Запланируй дела</small>'}</div>`}).join('');
   const ev=d.events.length?d.events.slice().reverse().map(e=>`<li>${esc(typeof e==='string'?e:(e.text||e.title||e.name||JSON.stringify(e)))}</li>`).join(''):'<li>Особых записей пока нет. Новые события появятся по мере прохождения.</li>';
   return {title:'🗓️ Календарь жизни',body:`<p>Игровой календарь: <b>день ${d.day}, ${String(d.hour).padStart(2,'0')}:00</b>. Неделя помогает планировать занятия и встречи.</p><div class="guide-calendar">${dayNames}</div><h4>Записи событий</h4><ul>${ev}</ul><p class="guide-note">Это календарь-планировщик: он показывает игровое время и уже записанные события. Будущие встречи автоматически не назначаются.</p>`};
  }
  if(key==='achievements'){
   const unlocked=[];const checks=[['🌅','Новая глава','Начать новую жизнь в городе',d.day>=1],['👋','Первое знакомство','Познакомиться хотя бы с одним жителем',d.known.length>=1],['🧑‍🤝‍🧑','Круг общения','Познакомиться с тремя жителями',d.known.length>=3],['🏡','Гостеприимство','Пригласить кого-нибудь домой',d.visits>=1],['🎁','Знак внимания','Подарить первый подарок',d.gifts.length>=1],['💪','Сила привычки','Достичь 50 формы',d.stats.fitness>=50],['🧠','Любознательность','Достичь 50 интеллекта',d.stats.intellect>=50],['💃','Яркая личность','Достичь 50 харизмы',d.stats.charisma>=50],['💗','Доверие','Достичь 70 симпатии с кем-нибудь',d.known.some(p=>p.love>=70)],['📋','План выполнен','Завершить три задания',d.quests.filter(q=>q.done).length>=3],['💼','Карьерный рост','Получить второй уровень работы',d.jobLevel>=2]];
   checks.forEach(x=>{if(x[3])unlocked.push(x)});
   return {title:'🏆 Достижения',body:`<p><b>${unlocked.length} / ${checks.length}</b> достижений открыто.</p><div class="achievement-list">${checks.map(x=>`<div class="achievement ${x[3]?'earned':''}"><span>${x[3]?x[0]:'🔒'}</span><div><b>${x[1]}</b><small>${x[2]}</small></div><em>${x[3]?'Получено':'Не получено'}</em></div>`).join('')}</div><p class="guide-note">Достижения вычисляются автоматически по текущему прогрессу и не требуют отдельного подтверждения.</p>`};
  }
  if(key==='tree'){
   const nodes=[['✨ Внешность','beauty','Уход и стиль'],['🫧 Уход','groom','Регулярная забота о себе'],['💪 Форма','fitness','Тренировки и активность'],['🧠 Интеллект','intellect','Чтение и творчество'],['🎭 Харизма','charisma','Общение и выступления'],['💗 Настроение','mood','Отдых и приятные занятия']];
   return {title:'🌱 Дерево навыков',body:`<p>Развитие героя: выполняй подходящие занятия, чтобы открывать следующие ступени.</p><div class="skill-tree">${nodes.map(([label,k,desc])=>{let v=Math.max(0,Math.min(100,Number(d.stats[k]||0))),tier=v>=75?'Мастерство':v>=50?'Продвинутый уровень':v>=25?'Уверенная база':'Начало пути';return `<div class="skill-node"><div class="row between"><b>${label}</b><strong>${Math.round(v)}/100</strong></div><div class="skill-track"><i style="width:${v}%"></i></div><small>${desc} · ${tier}</small><div class="skill-milestones"><span class="${v>=25?'on':''}">25</span><span class="${v>=50?'on':''}">50</span><span class="${v>=75?'on':''}">75</span><span class="${v>=100?'on':''}">100</span></div></div>`}).join('')}</div><p class="guide-note">Показаны реальные характеристики героя. Это визуальная карта развития, а не отдельная валюта или система покупки перков.</p>`};
  }
  if(key==='tips'){
   const tips=[];if(d.energy<25)tips.push('⚡ Энергии мало. Лучше отдохнуть или поспать, прежде чем отправляться на затратные занятия.');if(d.mood<35)tips.push('🌿 Настроение снижено. Попробуй прогулку, готовку или спокойный досуг.');if(d.money<40)tips.push('💰 Денег осталось немного. Проверь доступность рабочей смены и бесплатных занятий.');if(!d.known.length)tips.push('👋 Пока нет знакомых. Исследуй город и заглядывай в разные локации.');if(d.known.length&&d.known.every(p=>p.love<30))tips.push('💗 Чтобы сблизиться с персонажами, общайся регулярно и выбирай внимательные ответы.');if(d.quests.some(q=>!q.done))tips.push(`📋 У тебя осталось ${d.quests.filter(q=>!q.done).length} незавершённых заданий — загляни в список целей.`);if(d.stats.fitness<30)tips.push('💪 Форма пока на начальном уровне. Подойдут прогулки, йога или тренировки с учётом энергии.');if(!tips.length)tips.push('🌸 Отличный темп! Проверь отношения, задания и новые занятия в городе — возможно, уже доступен следующий сюжетный шаг.');
   return {title:'💡 Подсказки для твоего прохождения',body:`<p>Советы обновляются по текущему состоянию героя.</p><ul>${tips.map(x=>`<li>${x}</li>`).join('')}</ul><p class="guide-note">Подсказки не выполняют действия за игрока и не меняют параметры автоматически.</p>`};
  }
  return null;
 }
 function show(key){const g=dynamicGuide(key)||guides[key]||guides.start;article.innerHTML='<h3>'+g.title+'</h3>'+g.body;modal.querySelectorAll('[data-guide]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.guide===key)));}
 function open(){show('start');modal.hidden=false;document.body.style.overflow='hidden';modal.querySelector('.guide-close').focus();}
 function close(){modal.hidden=true;document.body.style.overflow='';helper.focus();}
 helper.addEventListener('click',open);modal.querySelector('.guide-close').addEventListener('click',close);
 modal.addEventListener('click',e=>{if(e.target===modal)close();const b=e.target.closest('[data-guide]');if(b)show(b.dataset.guide)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()});
 show('start');
})();
</script>
<script>
(function(){if(window.__lwAmbient)return;window.__lwAmbient=setInterval(()=>{if(S.tab!=="city"||!S.worldInterior)return;document.querySelectorAll(".lw-npc").forEach((el,i)=>{if(Math.random()<.35){el.style.left=(16+Math.random()*68)+"%";el.style.top=(18+Math.random()*62)+"%";}});},5200);})();
</script>
